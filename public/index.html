<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F4F1">
<title>Meridian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F4F1; --surface:#FBFBF9; --surface-2:#EAECE6; --sunken:#E3E6DE;
  --line:#DCDFD7; --line-2:#C3C8BA;
  --ink:#1A1D19; --ink-2:#565C52; --ink-3:#868C80;
  --brass:#8A6416; --brass-2:#B08428; --brass-wash:#F2E9D5;
  --up:#1E6B45; --down:#A33929; --steel:#3A5A79; --violet:#5B4B8A; --clay:#8A5A3C;
  --c1:#8A6416; --c2:#3A5A79; --c3:#5B4B8A; --c4:#8A5A3C; --c5:#1E6B45; --c6:#2F7D7A; --c7:#9C4A6B; --c8:#6B7A2F;
  --shadow:0 1px 2px rgba(26,29,25,.06);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light dark;
}
:root:not([data-theme="light"]){ }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#161915; --surface:#1D211C; --surface-2:#252A24; --sunken:#12150F;
    --line:#333930; --line-2:#454C41;
    --ink:#E9EBE5; --ink-2:#A3A99D; --ink-3:#7A8074;
    --brass:#D4A648; --brass-2:#E2BC6B; --brass-wash:#2C2718;
    --up:#5FBF8D; --down:#E0866F; --steel:#7FA8CC; --violet:#A395D4; --clay:#C89070;
    --c1:#D4A648; --c2:#7FA8CC; --c3:#A395D4; --c4:#C89070; --c5:#5FBF8D; --c6:#5DB8B3; --c7:#D683A6; --c8:#AFC06A;
    --shadow:0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --paper:#161915; --surface:#1D211C; --surface-2:#252A24; --sunken:#12150F;
  --line:#333930; --line-2:#454C41;
  --ink:#E9EBE5; --ink-2:#A3A99D; --ink-3:#7A8074;
  --brass:#D4A648; --brass-2:#E2BC6B; --brass-wash:#2C2718;
  --up:#5FBF8D; --down:#E0866F; --steel:#7FA8CC; --violet:#A395D4; --clay:#C89070;
    --c1:#D4A648; --c2:#7FA8CC; --c3:#A395D4; --c4:#C89070; --c5:#5FBF8D; --c6:#5DB8B3; --c7:#D683A6; --c8:#AFC06A;
  --shadow:0 1px 2px rgba(0,0,0,.3);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px); -webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"IBM Plex Sans","Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;
  font-size:14px; line-height:1.5; font-variant-numeric:tabular-nums;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.01em}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
a{color:var(--brass)}
:focus-visible{outline:2px solid var(--brass); outline-offset:2px; border-radius:2px}
.num{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif; font-weight:600; letter-spacing:-.015em}
.mono{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace}
.up{color:var(--up)} .down{color:var(--down)} .muted{color:var(--ink-3)} .dim{color:var(--ink-2)}
.hide{display:none !important}

/* ---------- shell ---------- */
.shell{display:grid; grid-template-columns:200px minmax(0,1fr); min-height:100vh}
.rail{
  min-width:0;
  border-right:1px solid var(--line); background:var(--surface);
  position:sticky; top:env(safe-area-inset-top,0px); align-self:start;
  height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; padding:20px 0 12px;
}
.brand{padding:0 18px 18px; display:flex; flex-direction:column; gap:1px; min-width:0}
.brand b{white-space:nowrap}
.brand b{font-family:"IBM Plex Sans Condensed",sans-serif; font-size:20px; font-weight:700; letter-spacing:.01em}
.brand span{font-size:12px; color:var(--ink-3)}
.nav{display:flex; flex-direction:column; gap:1px; padding:0 10px; flex:1; min-width:0}
.nav button{
  display:flex; align-items:center; justify-content:space-between; gap:8px;
  background:none; border:0; text-align:left; padding:7px 8px 7px 12px; cursor:pointer;
  color:var(--ink-2); border-radius:3px; position:relative; font-size:14px;
}
.nav button:hover{color:var(--ink); background:var(--surface-2)}
.nav button[aria-current="page"]{color:var(--ink); font-weight:600; background:var(--surface-2)}
.nav button[aria-current="page"]::before{
  content:""; position:absolute; left:0; top:6px; bottom:6px; width:3px; background:var(--brass); border-radius:0 2px 2px 0;
}
.nav .badge{
  background:var(--brass); color:var(--surface); font-size:11px; font-weight:600;
  min-width:18px; height:18px; border-radius:9px; display:grid; place-items:center; padding:0 5px;
}
.nav .badge[data-zero="1"]{display:none}
.railfoot{padding:10px 18px 0; border-top:1px solid var(--line); font-size:11.5px; color:var(--ink-3); display:flex; justify-content:space-between; align-items:center; gap:8px}
.railfoot span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.railfoot button{background:none;border:0;color:var(--ink-3);cursor:pointer;padding:2px;font-size:12px}
.railfoot button:hover{color:var(--brass)}

.main{min-width:0; padding:26px 30px 80px; max-width:1180px}
.topbar{display:none}

/* ---------- headers ---------- */
.viewhead{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:18px}
.viewhead h1{font-family:"IBM Plex Sans Condensed",sans-serif; font-size:30px; font-weight:700; line-height:1.05}
.viewhead .sub{color:var(--ink-3); font-size:13px; margin-top:3px}
.rowacts{display:flex; gap:8px; flex-wrap:wrap}

/* ---------- buttons ---------- */
.btn{
  background:var(--surface); border:1px solid var(--line-2); color:var(--ink);
  padding:6px 12px; border-radius:3px; cursor:pointer; font-size:13px; font-weight:500; white-space:nowrap;
}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .btn.primary{color:#1A1D19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.primary{color:#1A1D19}}
.btn.primary:hover{background:var(--brass-2); border-color:var(--brass-2)}
.btn.quiet{border-color:transparent; background:transparent; color:var(--ink-2); padding:6px 8px}
.btn.quiet:hover{color:var(--ink); background:var(--surface-2); border-color:transparent}
.btn.danger{color:var(--down); border-color:var(--line-2)}
.btn.primary.danger{background:var(--down); border-color:var(--down); color:#fff}
.btn.primary.danger:hover{background:var(--down); border-color:var(--down); filter:brightness(1.1)}
.btn.danger:hover{border-color:var(--down)}
.btn:disabled{opacity:.45; cursor:default}
.btn.sm{padding:3px 8px; font-size:12px}

/* ---------- panels ---------- */
.panel{background:var(--surface); border:1px solid var(--line); border-radius:4px; margin-bottom:18px}
.panel > header{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:11px 14px; border-bottom:1px solid var(--line);
}
.panel > header h2{font-size:14px; font-weight:600}
.panel > header .note{font-size:12px; color:var(--ink-3)}
.panel .body{padding:14px}
.panel .body.flush{padding:0}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:18px; align-items:start; margin-bottom:18px}
#view:focus{outline:none}
.grid2 .panel{margin:0}

/* ---------- hero ---------- */
.hero{margin-bottom:26px}
.hero .label{font-size:13px; color:var(--ink-3)}
.hero .figure{display:flex; align-items:baseline; gap:14px; flex-wrap:wrap}
.hero .figure .big{font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700; font-size:clamp(40px,7vw,62px); line-height:1; letter-spacing:-.02em}
.hero .figure .delta{font-size:15px; font-weight:600}
.hero .rule{height:3px; background:var(--brass); margin:14px 0 0; border-radius:2px; max-width:520px}
.herogrid{display:grid; grid-template-columns:minmax(260px,1fr) minmax(280px,1.1fr); gap:28px; align-items:end}
.rhythm{min-width:0}
.rhythm .cap{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-3); margin-bottom:6px}
.rhythm svg{width:100%; height:56px; display:block}

/* ---------- tables ---------- */
table{width:100%; border-collapse:collapse; font-size:13px}
th{
  text-align:right; font-weight:500; color:var(--ink-3); font-size:12px;
  padding:8px 12px; border-bottom:1px solid var(--line); white-space:nowrap;
}
th:first-child,td:first-child{text-align:left; padding-left:14px}
th:last-child,td:last-child{padding-right:14px}
td{padding:9px 12px; border-bottom:1px dotted var(--line); text-align:right; vertical-align:top}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface-2)}
tr.group td{background:var(--surface-2); font-weight:600; color:var(--ink-2); border-bottom:1px solid var(--line); font-size:12px; padding-top:6px; padding-bottom:6px}
tr.lotrow td{background:var(--sunken); font-size:12.5px; color:var(--ink-2)}
tr.lotrow td:first-child{padding-left:30px}
.tablewrap{overflow-x:auto}
.tablewrap table{min-width:560px}
.name{display:flex; flex-direction:column; gap:1px}
.name b{font-weight:600}
.name small{color:var(--ink-3); font-size:11.5px}
.tag{
  display:inline-block; font-size:11px; padding:1px 6px; border-radius:2px;
  background:var(--surface-2); color:var(--ink-2); border:1px solid var(--line);
}
.tag.brass{background:var(--brass-wash); color:var(--brass); border-color:transparent; font-weight:500}
.tag.up{background:transparent; border-color:var(--up); color:var(--up)}
.tag.down{background:transparent; border-color:var(--down); color:var(--down)}

/* ---------- stats ---------- */
.stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:1px; background:var(--line)}
.stats > div{background:var(--surface); padding:12px 14px}
.stats .k{font-size:12px; color:var(--ink-3); margin-bottom:2px}
.stats .v{font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; font-size:22px; line-height:1.1}

/* ---------- checklist ---------- */
.check{display:flex; align-items:center; gap:10px; padding:9px 14px; border-bottom:1px dotted var(--line); cursor:pointer}
.check:last-child{border-bottom:0}
.check:hover{background:var(--surface-2)}
.box{
  width:17px; height:17px; border:1.5px solid var(--line-2); border-radius:3px; flex:none;
  display:grid; place-items:center; transition:background .12s ease, border-color .12s ease;
}
.check[data-on="1"] .box{background:var(--brass); border-color:var(--brass)}
.box svg{opacity:0; width:11px; height:11px}
.check[data-on="1"] .box svg{opacity:1}
.check[data-on="1"] .ctext b{color:var(--ink-3); text-decoration:line-through; text-decoration-color:var(--line-2)}
.check[data-on="1"] .ctext small{color:var(--ink-3)}
.ctext{flex:1; min-width:0}
.ctext b{font-weight:500; display:block; overflow:hidden; text-overflow:ellipsis}
.ctext small{color:var(--ink-3); font-size:11.5px}

/* ---------- habit grid ---------- */
.habitcard{border:1px solid var(--line); border-radius:4px; background:var(--surface); padding:12px 14px}
.habitcard header{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:10px}
.hgrid{display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,15px); grid-auto-columns:15px; gap:3px; overflow-x:auto; padding:2px 2px 4px}
.hcell{width:15px; height:15px; border-radius:3px; background:var(--sunken); border:1px solid transparent}
.hcell[data-s="on"]{background:var(--brass)}
.hcell[data-s="due"]{background:var(--surface-2); border-color:var(--line-2)}
.hcell[data-s="future"]{background:transparent}
.hcell[data-today="1"]{outline:1.5px solid var(--ink-3); outline-offset:1px}
.hcell[data-date]{cursor:pointer}
.hcell[data-date]:hover{outline:1.5px solid var(--brass); outline-offset:1px}

/* ---------- bars ---------- */
.bar{height:7px; background:var(--sunken); border-radius:4px; overflow:hidden; margin-top:6px}
.bar i{display:block; height:100%; background:var(--brass); border-radius:4px}
.bar i.over{background:var(--down)}
.bar i.good{background:var(--up)}
.envelope{padding:11px 14px; border-bottom:1px dotted var(--line)}
.envelope:last-child{border-bottom:0}
.envelope .top{display:flex; justify-content:space-between; gap:10px; align-items:baseline}
.envelope .top b{font-weight:500}
.envelope .fig{font-size:13px}
.split{display:flex; height:10px; border-radius:2px; overflow:hidden; background:var(--sunken)}
.split i{display:block; height:100%}
.legend{display:flex; flex-wrap:wrap; gap:12px; margin-top:10px; font-size:12px; color:var(--ink-2)}
.legend span{display:flex; align-items:center; gap:6px}
.legend i{width:9px; height:9px; border-radius:2px; display:block}

/* ---------- forms ---------- */
.field{display:flex; flex-direction:column; gap:4px; margin-bottom:12px; min-width:0}
.field > label{font-size:12px; color:var(--ink-2)}
.field .hint{font-size:11.5px; color:var(--ink-3)}
input,select,textarea{
  background:var(--surface); border:1px solid var(--line-2); border-radius:3px;
  padding:7px 9px; width:100%; font-size:13.5px;
}
input:focus,select:focus,textarea:focus{border-color:var(--brass); outline:none}
input[type=checkbox]{width:auto}
textarea{resize:vertical; min-height:60px}
.frow{display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:0 12px}
.seg{display:flex; gap:0; border:1px solid var(--line-2); border-radius:3px; overflow:hidden; width:fit-content; flex-wrap:wrap}
.seg button{background:var(--surface); border:0; padding:6px 11px; cursor:pointer; font-size:13px; color:var(--ink-2); border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--brass-wash); color:var(--brass); font-weight:600}
.daypick{display:flex; gap:4px; flex-wrap:wrap}
.daypick button{width:34px; height:30px; border:1px solid var(--line-2); background:var(--surface); border-radius:3px; cursor:pointer; font-size:12px; color:var(--ink-2)}
.daypick button[aria-pressed="true"]{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .daypick button[aria-pressed="true"]{color:#1A1D19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .daypick button[aria-pressed="true"]{color:#1A1D19}}

/* ---------- dialog ---------- */
dialog{
  border:1px solid var(--line-2); border-radius:5px; background:var(--surface); color:var(--ink);
  padding:0; width:min(560px,calc(100vw - 28px)); box-shadow:0 18px 50px rgba(0,0,0,.22);
  max-height:min(88vh,860px);
}
dialog::backdrop{background:rgba(16,18,15,.45)}
dialog header{display:flex; justify-content:space-between; align-items:center; padding:13px 16px; border-bottom:1px solid var(--line)}
dialog header h3{font-size:15px}
dialog .dbody{padding:16px; overflow:auto; max-height:min(66vh,620px)}
dialog footer{display:flex; justify-content:space-between; gap:10px; padding:12px 16px; border-top:1px solid var(--line); background:var(--surface-2)}
dialog footer .right{display:flex; gap:8px; margin-left:auto}
.wide{width:min(720px,calc(100vw - 28px))}

/* ---------- training: splits list ---------- */
.splitrow{display:flex; align-items:center; gap:10px; border-bottom:1px dotted var(--line); position:relative}
.splitrow:last-child{border-bottom:0}
.splitrow.viewing{background:var(--surface-2)}
.splitrow.viewing::before{content:""; position:absolute; left:0; top:8px; bottom:8px; width:3px; background:var(--brass); border-radius:0 2px 2px 0}
.splitmain{flex:1; min-width:0; background:none; border:0; text-align:left; padding:12px 14px; cursor:pointer; display:flex; flex-direction:column; gap:3px; color:inherit; font:inherit}
.splitmain:hover .splitname{text-decoration:underline; text-underline-offset:3px; text-decoration-color:var(--line-2)}
.splitmain .top{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.splitname{font-weight:600; font-size:14.5px}
.splitmeta{color:var(--ink-3); font-size:12px}
.splitacts{display:flex; gap:4px; padding-right:12px; flex-wrap:wrap; justify-content:flex-end; align-items:center}
.miniweek{display:flex; gap:3px; margin-top:5px}
.miniweek span{width:19px; height:19px; border-radius:3px; display:grid; place-items:center; font-size:10px; font-weight:600; border:1px solid var(--line-2); color:var(--ink-3)}
.miniweek span.on{background:var(--brass); border-color:var(--brass); color:#fff}
:root[data-theme="dark"] .miniweek span.on{color:#1A1D19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .miniweek span.on{color:#1A1D19}}
.splithead{display:flex; align-items:flex-end; justify-content:space-between; gap:14px; flex-wrap:wrap; margin:26px 0 12px}
.splithead .splittitle{font-family:"IBM Plex Sans Condensed","IBM Plex Sans",sans-serif; font-size:22px; font-weight:700; line-height:1.1}
@media (max-width:640px){
  .splitrow{flex-direction:column; align-items:stretch; gap:0}
  .splitacts{padding:0 14px 12px; justify-content:flex-start}
}

/* ---------- muscles ---------- */
.mpick{display:flex; flex-direction:column; gap:7px}
.mregion{display:grid; grid-template-columns:118px minmax(0,1fr); gap:8px; align-items:start}
.mregion-name{font-size:12px; color:var(--ink-3); padding-top:5px}
.mchips{display:flex; flex-wrap:wrap; gap:5px}
.mchip{border:1px solid var(--line-2); background:var(--surface); border-radius:13px; padding:3px 10px; font-size:12.5px; cursor:pointer; color:var(--ink-2)}
.mchip:hover{border-color:var(--ink-3)}
.mchip[data-v="1"]{background:var(--brass); border-color:var(--brass); color:#fff}
.mchip[data-v="h"]{background:var(--brass-wash); border:1px dashed var(--brass); color:var(--brass)}
:root[data-theme="dark"] .mchip[data-v="1"]{color:#1A1D19}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .mchip[data-v="1"]{color:#1A1D19}}
.name small.untagged{font-style:italic}
.vol{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:6px 30px}
.volregion h3{font-size:12px; color:var(--ink-3); font-weight:500; margin:4px 0 2px}
.volrow{display:grid; grid-template-columns:92px minmax(0,1fr) 36px; gap:10px; align-items:center; padding:4px 0; font-size:13px}
.volbar{height:9px; background:var(--sunken); border-radius:5px; overflow:hidden; display:flex}
.volbar i{display:block; height:100%}
.volbar i.d{background:var(--brass)}
.volbar i.x{background:var(--brass); opacity:.4}
.volrow .nv{text-align:right; font-weight:600}
.volrow.zero{color:var(--ink-3)}
.volrow.zero .nv{font-weight:400}
@media (max-width:640px){ .mregion{grid-template-columns:1fr; gap:4px} .mregion-name{padding-top:0} }

/* ---------- weight target ---------- */
.wtarget{border:1px solid var(--line); border-radius:4px; padding:10px 12px; margin-bottom:14px; background:var(--surface-2)}
.wtarget .bar{margin-top:8px}

/* ---------- net worth charts ----------
   Categorical slots in stacking order, validated for colour-blind and normal-vision separation
   against this app's surfaces in both themes. Credit cards reuse the loans hue with a hatch. */
.nwviz{--nw1:#2a78d6; --nw2:#eb6834; --nw3:#1baf7a; --nw4:#eda100; --nw5:#e87ba4; --nw6:#008300; --nw7:#6250d6; --nw8:#e34948}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])) .nwviz{--nw1:#3987e5; --nw2:#d95926; --nw3:#199e70; --nw4:#c98500; --nw5:#d55181; --nw6:#008300; --nw7:#9085e9; --nw8:#e66767}
}
:root[data-theme="dark"] .nwviz{--nw1:#3987e5; --nw2:#d95926; --nw3:#199e70; --nw4:#c98500; --nw5:#d55181; --nw6:#008300; --nw7:#9085e9; --nw8:#e66767}
.tchart{position:relative; user-select:none; -webkit-user-select:none}
.tchart svg{display:block; width:100%; overflow:visible}
.tchart .ylab{position:absolute; left:-48px; width:42px; text-align:right; font-size:11px; color:var(--ink-3); transform:translateY(-50%); pointer-events:none; font-variant-numeric:tabular-nums}
.tchart .pl{position:relative; margin-left:48px}
.tchart .xlabs{display:flex; justify-content:space-between; font-size:11px; color:var(--ink-3); margin-top:5px; margin-left:48px}

</div>

</form></dialog>
<script>
/* ============================================================
   Meridian — personal command board
   Single file. Runs hosted (Claude artifact db) or standalone

"use strict";

var YEAR_NOW = new Date().getFullYear();
var ELLIPSIS = "\u2026";

/* ---------- state ---------- */
var S = {
  settings: {
    base: "AUD",
    fx: { AUD: 1 },
    fxAt: null,
    keys: { twelvedata: "", finnhub: "" },
    proxyUrl: "",
    autoRefresh: 0,
    lastPriceRun: null,
    lastSnapshot: null,
    lastExportAt: null,
    backupSnoozeUntil: null,
    shards: {},

  portfolio: { positions: [], lots: [], disposals: [], cash: [] },
  networth: { accounts: [], snapshots: [] },
  budget: { categories: [] },
  tx: {},            // 'YYYY-MM' -> { items: [transactions] }
  txLegacy: {},      // 'YYYY' -> { items } — the previous version's one-document-per-year format
  habits: { items: [] },
  hlog: {},          // year -> { 'YYYY-MM-DD': { habitId: count } }
  reminders: { items: [] },
  training: { gyms: [], splits: [], activeId: null },
  tsess: {},         // year -> { 'YYYY-MM-DD': { workoutId, splitId, done:{}, finished } }
  nutrition: { targets: { kcal: 0, protein: 0, carbs: 0, fat: 0 }, foods: [] },
  body: { weights: [] },
  food: {}           // 'YYYY-MM' -> { days: { 'YYYY-MM-DD': [entries] } }
};

var UI = {
  view: "today",
  txMonth: null,
  netRange: 180,
  remFilter: "open",
  expanded: {},      // positionId -> show lots
  priceStatus: "",

  busy: false

      else if (k === "html") e.innerHTML = v;
      else if (k === "class") e.className = v;
      else if (k.slice(0, 2) === "on") e.addEventListener(k.slice(2), v);

function frag(children) { var f = document.createDocumentFragment(); add(f, children); return f; }
function qs(sel, root) { return (root || document).querySelector(sel); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

/* ---------- dates (local, Monday-first weeks) ---------- */
function today() { return iso(new Date()); }
function iso(d) {

function yearOf(s) { return String(s).slice(0, 4); }

  if (n === 1) return "tomorrow";
  if (n === -1) return "yesterday";
  if (n < 0) return Math.abs(n) + "d overdue";

/* ---------- numbers ---------- */
function money(v, cur, dp) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  var c = cur || S.settings.base;
  try {
    return new Intl.NumberFormat("en-AU", {

      currencyDisplay: c === S.settings.base ? "narrowSymbol" : "code",

function signed(v, cur) { return (v > 0 ? "+" : "") + money(v, cur); }

function num(v, dp) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  return new Intl.NumberFormat("en-AU", { maximumFractionDigits: dp === undefined ? 6 : dp }).format(v);
}
function price(v) {
  if (v === null || v === undefined || isNaN(v)) return "—";
  var a = Math.abs(v);
  var dp = a >= 100 ? 2 : a >= 1 ? 4 : a >= 0.0001 ? 6 : 10;
  return new Intl.NumberFormat("en-AU", { minimumFractionDigits: 2, maximumFractionDigits: dp }).format(v);

function n(v, d) { var x = parseFloat(v); return isFinite(x) ? x : (d === undefined ? 0 : d); }

/* ============================================================
   Storage & sync
   ------------------------------------------------------------
   Every section of the board ("slice") is one JSON document.
   It always lives in this browser; when hosted it also lives in
   the artifact's private per-user store and syncs across devices.

   The rules that keep data safe:
   1. Every edit lands on this device first and is marked unsynced
      until the account confirms it. Unsynced edits survive reloads.
   2. Every document in the account carries a revision. Each device
      remembers which revision its copy was built on (its "base").
   3. Nothing is written to a slice until its account copy has been
      read at least once, so unseen data is never overwritten.
   4. Every write reads the account copy first. If another device
      wrote since our base, the three versions (base, ours, theirs)
      are merged item by item before writing.

      a dialog is open or a field has focus.

var LEASE_MS = 2000;                // one writer at a time per document, across devices and tabs
var INITIAL = clone(S);             // pristine defaults for every slice

var Store = { db: null, uid: null, prefix: "meridian:", forgotten: false };
var Sync = {
  device: null,
  tab: uid(),
  slices: {},          // name -> runtime state (ready, loading, timers, errors, size)
  meta: {},            // name -> { baseRev, dirtyAt } mirrored to localStorage
  base: {},            // name -> data as of baseRev (the merge ancestor)
  pending: {},         // name -> remote document waiting to be folded in
  legacyChecked: {},
  started: false,      // true once we know whether the account store is available
  disabled: false,     // account sync switched off for this session (access revoked etc.)
  localFull: false,
  lastMergeToast: 0
};

/* ---------- small utilities ---------- */
function clone(v) { return v === undefined ? undefined : JSON.parse(JSON.stringify(v)); }
function stable(v) {
  if (v === undefined) return "~";
  if (v === null || typeof v !== "object") return JSON.stringify(v);
  if (Array.isArray(v)) return "[" + v.map(stable).join(",") + "]";
  return "{" + Object.keys(v).filter(function (k) { return v[k] !== undefined; }).sort()

function same(a, b) { return stable(a) === stable(b); }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function byteSize(obj) {
  var s = JSON.stringify(obj);
  try { return new Blob([s]).size; } catch (e) { return s.length; }
}

/* ---------- this browser ---------- */
function lsGet(name) {
  try { var r = localStorage.getItem(Store.prefix + name); return r ? JSON.parse(r) : null; }
  catch (e) { return null; }
}
function lsSet(name, obj) {
  if (Store.forgotten) return false;
  try { localStorage.setItem(Store.prefix + name, JSON.stringify(obj)); Sync.localFull = false; return true; }
  catch (e) { Sync.localFull = true; return false; }

function lsDel(name) { try { localStorage.removeItem(Store.prefix + name); } catch (e) {} }
function lsKeys() {
  var out = [];
  try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); if (k && k.indexOf(Store.prefix) === 0) out.push(k.slice(Store.prefix.length)); } }
  catch (e) {}

function meta(name) {
  if (!Sync.meta[name]) Sync.meta[name] = lsGet("meta:" + name) || { baseRev: null, dirtyAt: null };
  return Sync.meta[name];
}
function saveMeta(name) { lsSet("meta:" + name, meta(name)); }

/* ---------- where each slice lives in memory ---------- */
var SHARDS = [
  { re: /^tx-(\d{4}-\d{2})$/, bag: "tx", empty: function () { return { items: [] }; } },
  { re: /^tx-(\d{4})$/, bag: "txLegacy", empty: function () { return { items: [] }; }, legacy: true },
  { re: /^food-(\d{4}-\d{2})$/, bag: "food", empty: function () { return { days: {} }; } },
  { re: /^hlog-(\d{4})$/, bag: "hlog", empty: function () { return { days: {} }; } },
  { re: /^tsess-(\d{4})$/, bag: "tsess", empty: function () { return { days: {} }; } }
];
function shardOf(name) {
  for (var i = 0; i < SHARDS.length; i++) { var m = SHARDS[i].re.exec(name); if (m) return { spec: SHARDS[i], key: m[1] }; }
  return null;

function isKnownSlice(name) { return BASE_SLICES.indexOf(name) >= 0 || !!shardOf(name); }
function sliceGet(name) {
  var sh = shardOf(name);
  if (sh) return (S[sh.spec.bag] || {})[sh.key];

}
function sliceSet(name, data) {
  var sh = shardOf(name);
  if (sh) { if (!S[sh.spec.bag]) S[sh.spec.bag] = {}; S[sh.spec.bag][sh.key] = data; }
  else S[name] = data;

/* ============================================================
   Money engine — FX, lots, valuation, realised gains
   ============================================================ */

function fxRate(cur) {
  if (!cur || cur === S.settings.base) return 1;
  var r = S.settings.fx[cur];
  return (r && isFinite(r) && r > 0) ? r : null;     // null = unknown rate
}
function toBase(amount, cur) {
  var r = fxRate(cur);
  return r === null ? null : amount * r;
}
function baseOr0(amount, cur) { var v = toBase(amount, cur); return v === null ? 0 : v; }
function missingRates() {
  var miss = {};
  S.portfolio.positions.forEach(function (p) { if (fxRate(p.currency) === null) miss[p.currency] = 1; });
  S.networth.accounts.forEach(function (a) { if (fxRate(a.currency) === null) miss[a.currency] = 1; });
  cashList().forEach(function (c) { if (c.currency && fxRate(c.currency) === null) miss[c.currency] = 1; });
  return Object.keys(miss);
}

function pos(id) { return S.portfolio.positions.filter(function (p) { return p.id === id; })[0]; }
function lotsOf(id) { return S.portfolio.lots.filter(function (l) { return l.positionId === id; }); }
function disposalsOfLot(lotId) { return S.portfolio.disposals.filter(function (d) { return d.lotId === lotId; }); }
function disposalsOf(id) { return S.portfolio.disposals.filter(function (d) { return d.positionId === id; }); }

function contractSize(p) { return p.kind === "option" ? n(p.option && p.option.multiplier, 100) : 1; }
function sideSign(p) { return (p.kind === "option" && p.option && p.option.side === "short") ? -1 : 1; }

/** remaining units on a lot after disposals */
function lotOpenQty(lot) {
  var sold = disposalsOfLot(lot.id).reduce(function (a, d) { return a + n(d.qty); }, 0);
  return n(lot.qty) - sold;
}

/** valuation of one lot, in the position's native currency */
function lotValue(p, lot) {
  var openQty = lotOpenQty(lot);
  var mult = contractSize(p), sign = sideSign(p);
  var feeShare = n(lot.qty) > 0 ? n(lot.fees) * (openQty / n(lot.qty)) : 0;
  var cost = sign * (openQty * n(lot.unitCost) * mult) + feeShare;
  var mkt = p.price && isFinite(p.price.value) ? sign * openQty * n(p.price.value) * mult : null;
  return {
    openQty: openQty,
    cost: cost,
    value: mkt,
    gain: mkt === null ? null : mkt - cost,
    days: dayDiff(lot.date, today()),
    discount: dayDiff(lot.date, today()) > 365
  };
}

/** aggregate a position, in native and base currency */
function positionRoll(p) {
  var lots = lotsOf(p.id), openQty = 0, cost = 0, value = null, anyOpen = false;
  var nextDiscount = null;
  lots.forEach(function (l) {
    var lv = lotValue(p, l);
    if (lv.openQty <= 0.0000000001) return;
    anyOpen = true;
    openQty += lv.openQty; cost += lv.cost;
    if (lv.value !== null) value = (value === null ? 0 : value) + lv.value;
    if (!lv.discount) {
      var daysLeft = 366 - lv.days;
      if (nextDiscount === null || daysLeft < nextDiscount) nextDiscount = daysLeft;
    }
  });
  var realised = disposalsOf(p.id).reduce(function (a, d) { return a + n(d.gain); }, 0);
  var gain = value === null ? null : value - cost;
  var r = fxRate(p.currency);
  return {
    p: p, openQty: openQty, anyOpen: anyOpen, cost: cost, value: value, gain: gain,
    pctGain: (value === null || cost === 0) ? null : (gain / Math.abs(cost)) * 100,
    realised: realised, nextDiscount: nextDiscount,
    costBase: r === null ? null : cost * r,
    valueBase: (r === null || value === null) ? null : value * r,
    gainBase: (r === null || gain === null) ? null : gain * r,
    rateKnown: r !== null

}

/* ---------- cash held at brokers; negative = borrowing on margin ---------- */
function cashList() { return S.portfolio.cash || (S.portfolio.cash = []); }
function cashTotals() {
  var t = { cash: 0, margin: 0, net: 0, noRate: 0 };
  cashList().forEach(function (c) {
    var v = toBase(n(c.amount), c.currency || S.settings.base);
    if (v === null) { t.noRate++; return; }
    if (v >= 0) t.cash += v; else t.margin += v;
  });
  t.net = t.cash + t.margin;
  return t;
}
function portfolioTotals() {
  var t = { value: 0, cost: 0, gain: 0, realised: 0, unpriced: 0, noRate: 0, byKind: {} };
  S.portfolio.positions.forEach(function (p) {
    var r = positionRoll(p);
    var rate = fxRate(p.currency);
    if (rate === null) { if (r.anyOpen) t.noRate++; return; }
    if (r.anyOpen && r.value === null) t.unpriced++;
    var v = r.valueBase === null ? 0 : r.valueBase;
    var c = r.costBase === null ? 0 : r.costBase;
    t.value += v; t.cost += c;
    t.gain += (r.gainBase === null ? 0 : r.gainBase);
    t.realised += r.realised * rate;
    t.byKind[p.kind] = (t.byKind[p.kind] || 0) + v;
  });
  t.pct = t.cost ? (t.gain / Math.abs(t.cost)) * 100 : null;
  return t;
}

/** FIFO / strategy allocation of a sale across open lots */
function allocate(positionId, qty, strategy) {
  var p = pos(positionId);
  var open = lotsOf(positionId).map(function (l) {
    return { lot: l, open: lotOpenQty(l), days: dayDiff(l.date, today()), unitCost: n(l.unitCost) };
  }).filter(function (x) { return x.open > 0.00000001; });
  if (strategy === "lifo") open.sort(function (a, b) { return b.lot.date.localeCompare(a.lot.date); });
  else if (strategy === "hifo") open.sort(function (a, b) { return b.unitCost - a.unitCost; });
  else if (strategy === "discount") open.sort(function (a, b) {
    var ad = a.days > 365 ? 0 : 1, bd = b.days > 365 ? 0 : 1;
    return ad - bd || a.lot.date.localeCompare(b.lot.date);
  });
  else open.sort(function (a, b) { return a.lot.date.localeCompare(b.lot.date); });  // fifo
  var left = qty, out = [];
  open.forEach(function (x) {
    if (left <= 0.00000001) { out.push({ lotId: x.lot.id, take: 0, max: x.open, lot: x.lot }); return; }
    var take = Math.min(left, x.open);
    left -= take;
    out.push({ lotId: x.lot.id, take: take, max: x.open, lot: x.lot });
  });
  return { rows: out, short: left };
}

/** realised gain for one disposal slice */
function gainFor(p, lot, qty, unitPrice, fees) {
  var mult = contractSize(p), sign = sideSign(p);
  var feeShareBuy = n(lot.qty) > 0 ? n(lot.fees) * (qty / n(lot.qty)) : 0;
  var costPart = sign * qty * n(lot.unitCost) * mult + feeShareBuy;
  var proceeds = sign * qty * n(unitPrice) * mult - n(fees);
  return proceeds - costPart;
}

/* ============================================================

var Px = { running: false, timer: null, lastRun: null, fails: 0, note: "" };

function jget(url) {

    if (!res.ok) { var e = new Error("HTTP " + res.status); e.http = res.status; throw e; }
    return res.json();
  });
}
function isNetworkError(e) {

}
function markNetBlocked() { UI.netBlocked = true; }

function ago(isoStr) {
  if (!isoStr) return "never";
  var mins = Math.round((Date.now() - new Date(isoStr).getTime()) / 60000);
  if (mins < 1) return "just now";
  if (mins === 1) return "a minute ago";
  if (mins < 60) return mins + " minutes ago";
  var hrs = Math.round(mins / 60);
  if (hrs < 24) return hrs + (hrs === 1 ? " hour ago" : " hours ago");
  var d = Math.round(hrs / 24);

/** The proxy in use: one you set in Settings, otherwise the one deployed alongside this page. */
var AUTO_PROXY = null;
function proxyBase() { return (S.settings.proxyUrl || "").trim() || AUTO_PROXY || ""; }

async function detectProxy() {

function yahooUrl(symbol, range) {

function yahooPrice(value, currency) {

/** Split the auto-priced positions by provider so each provider gets as few calls as possible. */

      else g.dexSearch.push(p);
    } else if (src.type === "coingecko" && src.coinId) g.gecko.push(p);

function feedCount() {

/**

var ALLOC_BY = [{ v: "holding", l: "Holding" }, { v: "tag", l: "Tag" }, { v: "kind", l: "Type" }, { v: "currency", l: "Currency" }];

/* ---------- tags on positions ---------- */
function tagsOf(p) { return Array.isArray(p.tags) ? p.tags.filter(Boolean) : []; }
/** Every tag in use on an open position, A to Z. */
function allTags() {
  var seen = {};
  S.portfolio.positions.forEach(function (p) {
    if (!positionRoll(p).anyOpen) return;
    tagsOf(p).forEach(function (t) { if (!seen[t.toLowerCase()]) seen[t.toLowerCase()] = t; });
  });
  return Object.keys(seen).sort().map(function (k) { return seen[k]; });
}
/** Tags typed as "AI, semis,  Core" → ["AI", "semis", "Core"], de-duplicated, reusing the spelling already in use. */
function cleanTags(text) {
  var existing = {}, out = [], seen = {};
  allTags().forEach(function (t) { existing[t.toLowerCase()] = t; });
  String(text || "").split(",").forEach(function (raw) {
    var t = raw.trim().replace(/\s+/g, " ").slice(0, 30);
    if (!t) return;
    var k = t.toLowerCase();
    if (seen[k]) return;
    seen[k] = 1; out.push(existing[k] || t);
  });
  return out;
}
var UNTAGGED = "_untagged";
function tagFilter() {
  var f = UI.tagFilter;
  if (!f) return null;
  if (f !== UNTAGGED && !allTags().some(function (t) { return t === f; })) { UI.tagFilter = null; return null; }
  return f;
}
function passesTagFilter(p) {
  var f = tagFilter();
  if (!f) return true;
  var tags = tagsOf(p);
  return f === UNTAGGED ? !tags.length : tags.some(function (t) { return t.toLowerCase() === f.toLowerCase(); });
}
function tagChips(p) {
  var tags = tagsOf(p);
  if (!tags.length) return null;
  return h("span", { class: "tagrow" }, tags.map(function (t) {
    return h("button", { class: "ptag", text: t, title: "Show only " + t,

  }));
}
/** The filter bar above the chart, and what the filtered slice adds up to. */
function tagFilterBar() {

  var opts = [{ v: null, l: "All" }].concat(tags.map(function (t) { return { v: t, l: t }; }));

    });

var ALLOC_COLOURS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)", "var(--c6)", "var(--c7)", "var(--c8)"];
var ALLOC_MAX = 8;   // beyond this, the smallest slices fold into "Other"

function allocationData(by, opts) {
  opts = opts || {};
  var filtered = !opts.all && !!tagFilter();
  var groups = {}, shorts = 0, unpriced = 0, noRate = 0, holdings = 0, split = 0;
  S.portfolio.positions.forEach(function (p) {
    if (filtered && !passesTagFilter(p)) return;
    var r = positionRoll(p);
    if (!r.anyOpen) return;
    if (!r.rateKnown) { noRate++; return; }
    if (r.valueBase === null) { unpriced++; return; }
    if (r.valueBase < 0) { shorts += r.valueBase; return; }     // a pie can't show a liability
    if (r.valueBase === 0) return;
    holdings++;
    if (by === "tag") {
      // a holding with several tags is shared equally between them, so the ring still adds up to 100%
      var tags = tagsOf(p);
      if (tags.length > 1) split++;
      (tags.length ? tags : [null]).forEach(function (t) {
        var k = t ? "tag:" + t.toLowerCase() : UNTAGGED;
        var g = groups[k] || (groups[k] = { key: k, label: t || "Untagged", sub: "", value: 0, count: 0, untagged: !t });
        g.value += r.valueBase / (tags.length || 1); g.count++;

      return;

    var key, label, sub = "";
    if (by === "kind") { key = p.kind; label = kindLabel(p.kind); }

      if (tagsOf(p).length) sub += " \u00b7 " + tagsOf(p).join(", ");
    }
    var g = groups[key] || (groups[key] = { key: key, label: label, sub: sub, value: 0, count: 0 });
    g.value += r.valueBase; g.count++;
  });
  var margin = 0;
  if (!filtered) cashList().forEach(function (c) {
    var v = toBase(n(c.amount), c.currency || S.settings.base);
    if (v === null) { noRate++; return; }
    if (v < 0) { margin += v; return; }
    if (v === 0) return;
    var key, label, sub = "";
    if (by === "currency") { key = c.currency || S.settings.base; label = key; }
    else { key = "_cash"; label = "Cash"; }
    if (by === "tag") { key = "_cash"; label = "Cash"; }
    var g = groups[key] || (groups[key] = { key: key, label: label, sub: sub, value: 0, count: 0, names: [] });
    g.value += v;

      key: "_other", label: "Other", other: true, rest: rest, sub: rest.length + " smaller " + (by === "holding" ? "holdings" : "groups"),
      value: rest.reduce(function (a, g) { return a + g.value; }, 0),
      count: rest.reduce(function (a, g) { return a + g.count; }, 0)
    }]);
  }
  list.forEach(function (g, i) {
    g.colour = g.other ? "var(--ink-3)" : ALLOC_COLOURS[i % ALLOC_COLOURS.length];
    g.pct = total ? (g.value / total) * 100 : 0;
    (g.rest || []).forEach(function (x) {
      x.pct = total ? (x.value / total) * 100 : 0;
      if (by !== "holding") x.sub = plural(x.count, "holding");
    });
    if (g.key === "_cash") { g.sub = (g.names || []).join(", "); return; }
    if (by === "tag" && !g.other) { g.sub = plural(g.count, "holding"); if (g.untagged) g.colour = "var(--line-2)"; return; }
    if (by !== "holding" && !g.other) {
      g.sub = plural(g.count, "holding") + (by === "currency" && g.key === S.settings.base ? " \u00b7 your base currency" : "");
    }
  });
  return { list: list, total: total, shorts: shorts, unpriced: unpriced, noRate: noRate, holdings: holdings, margin: margin, split: split, filtered: filtered };
}

function moneyShort(v) {
  if (Math.abs(v) < 1e6) return money(v);
  try {
    return new Intl.NumberFormat("en-AU", { style: "currency", currency: S.settings.base, currencyDisplay: "narrowSymbol",
      notation: "compact", maximumFractionDigits: 2 }).format(v);
  } catch (e) { return money(v); }
}
function allocPct(p) { return p > 0 && p < 0.1 ? "<0.1%" : p.toFixed(1) + "%"; }

/** Ring drawn with stroke dashes: each slice is an arc of one circle, so a single 100% slice still closes cleanly. */
function donutSvg(d) {

  o += '<circle cx="100" cy="100" r="' + R + '" fill="none" stroke="var(--sunken)" stroke-width="' + W + '"/>';
  d.list.forEach(function (g) {
    var len = (g.value / d.total) * C;
    var gap = d.list.length > 1 && len > 3 ? 1.4 : 0;
    o += '<circle class="slice" data-key="' + esc(g.key) + '" cx="100" cy="100" r="' + R + '" fill="none" stroke="' + g.colour +
      '" stroke-width="' + W + '" stroke-dasharray="' + Math.max(0.01, len - gap).toFixed(3) + " " + (C - len + gap).toFixed(3) +
      '" stroke-dashoffset="' + (-acc).toFixed(3) + '" transform="rotate(-90 100 100)"><title>' +
      esc(g.label) + " \u00b7 " + allocPct(g.pct) + " \u00b7 " + esc(money(g.value)) + "</title></circle>";

   Training — splits, workouts, exercises, gyms

function gymById(id) {
  for (var i = 0; i < S.training.gyms.length; i++) if (S.training.gyms[i].id === id) return S.training.gyms[i];
  return null;
}
function gymName(id) { var g = gymById(id); return g ? g.name : ""; }
function activeSplit() {
  var sp = S.training.splits;
  for (var i = 0; i < sp.length; i++) if (sp[i].id === S.training.activeId) return sp[i];
  return sp[0] || null;
}
function workoutById(split, id) {
  if (!split) return null;
  for (var i = 0; i < split.workouts.length; i++) if (split.workouts[i].id === id) return split.workouts[i];
  return null;
}
function firstRep(reps) {
  var m = String(reps === undefined || reps === null ? "" : reps).match(/\d+/);
  return m ? parseInt(m[0], 10) : 10;
}
/** Rough moving time: work + rest + a little to reach the next machine. */
function exerciseSeconds(ex) {
  var sets = Math.max(1, n(ex.sets, 3));
  var work = Math.max(30, Math.round(firstRep(ex.reps) * 3.5));
  var rest = n(ex.rest, 75);
  return sets * (work + rest) + 45;
}
var WARMUP_SECONDS = 300;
function workoutMinutes(w) {
  var list = w.exercises || [];
  if (!list.length) return 0;
  var sec = list.reduce(function (a, e) { return a + exerciseSeconds(e); }, 0);
  return Math.round((sec + WARMUP_SECONDS) / 60);
}
function workoutSets(w) {
  return (w.exercises || []).reduce(function (a, e) { return a + Math.max(1, n(e.sets, 3)); }, 0);
}

}
function splitWeek(sp) {

function fmtMins(m) {

function splitVolume(sp) {

  for (var d = 0; d < 7; d++) {

    if (!w) continue;
    (w.exercises || []).forEach(function (ex) {

      if (!hasMuscles(ex)) { untaggedSets += sets; return; }
      Object.keys(ex.muscles).forEach(function (k) {

/* ---------- weight target ---------- */
function weightTarget() {
  var t = S.body.target;

}
function currentWeight() {

  return (st.trend !== null && st.trend !== undefined) ? st.trend : n(st.latest.kg);
}
function rateText(v) { return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + Math.abs(v).toFixed(2) + " kg a week"; }

/** Where you are against the target, stated as facts: no ahead/behind, no colour judgement. */
function targetProgress() {
  var t = weightTarget();
  if (!t) return null;
  var cur = currentWeight(), st = weightStats();
  var r = { t: t, target: n(t.kg), start: hasNum(t.startKg) ? n(t.startKg) : cur, cur: cur, by: t.by || null };
  if (cur === null || r.start === null) return r;
  var total = r.target - r.start;
  r.toGo = r.target - cur;
  r.maintain = Math.abs(total) < 0.3;
  r.dir = total > 0 ? 1 : total < 0 ? -1 : 0;
  r.pct = r.maintain ? null : clamp(((cur - r.start) / total) * 100, 0, 100);
  r.reached = !r.maintain && ((r.dir > 0 && cur >= r.target) || (r.dir < 0 && cur <= r.target));
  r.rate = st && st.perWeek !== null ? st.perWeek : null;
  if (r.by) {
    r.daysLeft = dayDiff(today(), r.by);
    if (r.daysLeft > 0 && !r.reached && !r.maintain) r.needRate = r.toGo / (r.daysLeft / 7);
  }
  if (!r.reached && !r.maintain && r.rate !== null && Math.abs(r.rate) >= 0.02 && (r.rate > 0) === (r.toGo > 0)) {
    r.eta = addDays(today(), Math.round((r.toGo / r.rate) * 7));
  }
  return r;
}
function targetStatus(p) {
  if (p.cur === null || p.toGo === undefined) return "Log a weigh-in to start tracking against it.";
  if (p.maintain) {
    return Math.abs(p.toGo) < 0.3 ? "On target" : kgText(Math.abs(p.toGo)) + (p.toGo < 0 ? " above" : " below") + " target";
  }
  if (p.reached) return Math.abs(p.toGo) >= 0.2 ? "Target reached, " + kgText(Math.abs(p.toGo)) + " past it" : "Target reached";
  return kgText(Math.abs(p.toGo)) + (p.toGo > 0 ? " to gain" : " to lose") + " \u00b7 " + Math.round(p.pct) + "% of the way";
}
function targetPace(p) {
  var lines = [];
  if (p.cur === null || p.toGo === undefined || p.reached || p.maintain) return lines;
  if (p.by && p.daysLeft <= 0) lines.push("The target date has passed.");
  else if (p.needRate !== undefined) lines.push("To reach it by " + fmtDate(p.by, true) + ": " + rateText(p.needRate) + ".");
  if (p.eta) lines.push("At your recent rate (" + rateText(p.rate) + "), around " + fmtDate(p.eta, true) + ".");
  else if (p.rate !== null) lines.push("Your recent trend (" + rateText(p.rate) + ") isn't heading toward it yet.");
  else lines.push("A month of weigh-ins adds a pace estimate.");
  return lines;
}

/**
 * Weigh-ins as dots, the 7-day average as a line, the target as a dashed rule,
 * and — when there's a date — the straight-line plan from your start to it.
 * Neutral colours throughout: gaining isn't bad, losing isn't good.
 */
function weightChart(list, days, target) {
  var end = today(), start = addDays(end, -(days - 1));
  var pts = list.filter(function (w) { return w.date >= start && w.date <= end; });
  if (pts.length < 2) return '<div class="empty" style="padding:22px">A couple of weigh-ins and the trend line starts drawing.</div>';
  var trend = pts.map(function (w) { return { x: w.date, y: trendOn(w.date, list) }; });
  var ys = pts.map(function (p) { return n(p.kg); }).concat(trend.map(function (t) { return t.y; }));

  var plan = null;
  if (target) {
    ys.push(n(target.kg));
    if (target.by && target.startDate && hasNum(target.startKg) && target.by > target.startDate) {
      var span0 = dayDiff(target.startDate, target.by);
      var at = function (d) { return n(target.startKg) + (n(target.kg) - n(target.startKg)) * clamp(dayDiff(target.startDate, d) / span0, 0, 1); };
      var x0 = target.startDate > start ? target.startDate : start, x1 = target.by < end ? target.by : end;
      if (x0 < x1) { plan = [{ x: x0, y: at(x0) }, { x: x1, y: at(x1) }]; ys.push(plan[0].y, plan[1].y); }
    }
  }

  var min = Math.min.apply(null, ys), max = Math.max.apply(null, ys);
  if (max - min < 1) { var mid = (max + min) / 2; min = mid - 0.5; max = mid + 0.5; }
  var span = max - min, lo = min - span * 0.15, hi = max + span * 0.15;
  var W = 720, H = 170, pl = 6, pr = 6, pt = 8, pb = 8;
  var total = Math.max(1, days - 1);
  var X = function (d) { return pl + (dayDiff(start, d) / total) * (W - pl - pr); };
  var Y = function (v) { return pt + (1 - (v - lo) / (hi - lo)) * (H - pt - pb); };
  var o = '<svg viewBox="0 0 ' + W + " " + H + '" preserveAspectRatio="none" style="width:100%;height:' + H + 'px;display:block" role="img" aria-label="Weight over time">';
  [0.25, 0.5, 0.75].forEach(function (f) {
    var yy = (pt + f * (H - pt - pb)).toFixed(1);
    o += '<line x1="0" x2="' + W + '" y1="' + yy + '" y2="' + yy + '" stroke="var(--line)" stroke-width="1"/>';
  });
  if (target) {
    var ty = Y(n(target.kg)).toFixed(1);
    o += '<line class="wt-target" x1="0" x2="' + W + '" y1="' + ty + '" y2="' + ty + '" stroke="var(--ink-2)" stroke-width="1.4" stroke-dasharray="6 5" vector-effect="non-scaling-stroke"><title>Target ' + esc(kgText(n(target.kg))) + "</title></line>";
  }
  if (plan) {
    o += '<line class="wt-plan" x1="' + X(plan[0].x).toFixed(1) + '" y1="' + Y(plan[0].y).toFixed(1) + '" x2="' + X(plan[1].x).toFixed(1) + '" y2="' + Y(plan[1].y).toFixed(1) +
      '" stroke="var(--steel)" stroke-width="1.6" stroke-dasharray="2 4" stroke-linecap="round" vector-effect="non-scaling-stroke"><title>Planned path to the target</title></line>';
  }
  pts.forEach(function (p) {
    o += '<circle cx="' + X(p.date).toFixed(1) + '" cy="' + Y(n(p.kg)).toFixed(1) + '" r="2.6" fill="var(--ink-3)" opacity="0.75"><title>' +
      esc(fmtDay(p.date)) + " \u00b7 " + esc(kgText(n(p.kg))) + "</title></circle>";
  });
  var d = trend.map(function (t, i) { return (i ? "L" : "M") + X(t.x).toFixed(1) + " " + Y(t.y).toFixed(1); }).join(" ");
  o += '<path d="' + d + '" fill="none" stroke="var(--brass)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" vector-effect="non-scaling-stroke"/>';
  o += "</svg>";
  o += '<div class="crumb" style="justify-content:space-between;margin-top:4px"><span>' + esc(fmtDate(start, true)) + "</span><span>" +
    esc(kgText(min)) + " \u2013 " + esc(kgText(max)) + "</span><span>today</span></div>";
  o += '<div class="legend"><span><i style="background:var(--ink-3);border-radius:50%"></i>weigh-in</span><span><i style="background:var(--brass);height:3px;width:14px"></i>7-day average</span>' +
    (target ? '<span><i style="width:14px;height:0;border-top:2px dashed var(--ink-2);border-radius:0"></i>target</span>' : "") +
    (plan ? '<span><i style="width:14px;height:0;border-top:2px dotted var(--steel);border-radius:0"></i>plan</span>' : "") + "</div>";
  return o;
}

  servIn = inp({ type: "number", step: "0.25", min: "0", value: d.servings, oninput: function (e) { d.servings = e.target.value; refresh(); } });
  kcalIn = inp({ type: "number", step: "1", min: "0", value: d.kcal, placeholder: "auto", oninput: function (e) { d.kcal = e.target.value; refresh(); } });
  pIn = inp({ type: "number", step: "0.1", min: "0", value: d.protein, oninput: function (e) { d.protein = e.target.value; refresh(); } });
  cIn = inp({ type: "number", step: "0.1", min: "0", value: d.carbs, oninput: function (e) { d.carbs = e.target.value; refresh(); } });
  fIn = inp({ type: "number", step: "0.1", min: "0", value: d.fat, oninput: function (e) { d.fat = e.target.value; refresh(); } });

  var body = h("div", {}, [
    field("Meal", segmented(MEALS, d.meal, function (v) { d.meal = v; })),
    field("Food", h("div", {}, [nameIn, dl])),
    h("div", { class: "frow" }, [
      field("Serving", servingIn),
      field("How many", servIn, "Servings")
    ]),
    h("div", { class: "muted", style: "font-size:12px;margin:-2px 0 8px", text: "Per serving" }),
    h("div", { class: "frow" }, [
      field("Calories", kcalIn, "Blank = from macros"),
      field("Protein (g)", pIn),
      field("Carbs (g)", cIn),
      field("Fat (g)", fIn)
    ]),
    totalLine,
    isNew ? h("label", { class: "mrow", style: "font-size:13px;color:var(--ink-2);margin-top:12px" }, [remember, " Save to my foods for next time"]) : null
  ]);
  refresh();

  openDialog({
    title: isNew ? "Log food" : "Edit entry",
    body: body,
    wide: true,
    left: isNew ? null : h("button", {
      type: "button", class: "btn danger", text: "Remove",
      onclick: function () {
        setFoodDay(date, foodDay(date).filter(function (x) { return x.id !== entry.id; }));
        closeDialog(); render();
      }
    }),
    actions: [{
      label: isNew ? "Log it" : "Save", primary: true,
      onClick: function () {
        if (!d.name.trim() && !hasNum(d.kcal) && !hasNum(d.protein) && !hasNum(d.carbs) && !hasNum(d.fat)) {
          toast("Give it a name or some numbers."); return false;
        }
        d.name = d.name.trim();
        d.servings = n(d.servings, 1) || 1;
        var list = foodDay(date).filter(function (x) { return x.id !== d.id; });
        list.push(d);
        setFoodDay(date, list);
        if (isNew && remember.checked && d.name) {
          var lib = S.nutrition.foods || (S.nutrition.foods = []);
          var existing = lib.filter(function (f) { return f.name.toLowerCase() === d.name.toLowerCase(); })[0];
          var rec = { id: existing ? existing.id : uid(), name: d.name, serving: d.serving, kcal: d.kcal, protein: d.protein, carbs: d.carbs, fat: d.fat };
          if (existing) Object.assign(existing, rec); else lib.push(rec);
          save("nutrition");
        }
        render();
      }
    }]
  });
}

function editTargets() {
  var t = JSON.parse(JSON.stringify(targets()));
  var line = h("div", { class: "estimate", style: "font-size:12.5px;color:var(--ink-2);margin-top:2px" });
  var kIn;
  function refresh() {
    var m = kcalFromMacros(t.protein, t.carbs, t.fat);
    line.innerHTML = "";
    if (!m) { line.textContent = "Set any you want to track. Leave the rest blank."; return; }
    add(line, [
      "Your macros add up to " + kc(m) + " kcal. ",
      Math.abs(m - n(t.kcal)) > 25 ? h("button", {
        type: "button", class: "linkbtn", text: "Use that as the calorie target",
        onclick: function () { t.kcal = m; kIn.value = m; refresh(); }
      }) : null
    ]);
  }
  kIn = inp({ type: "number", min: "0", value: n(t.kcal) || "", oninput: function (e) { t.kcal = n(e.target.value); refresh(); } });
  var body = h("div", {}, [
    h("div", { class: "frow" }, [
      field("Calories", kIn),
      field("Protein (g)", inp({ type: "number", min: "0", value: n(t.protein) || "", oninput: function (e) { t.protein = n(e.target.value); refresh(); } })),
      field("Carbs (g)", inp({ type: "number", min: "0", value: n(t.carbs) || "", oninput: function (e) { t.carbs = n(e.target.value); refresh(); } })),
      field("Fat (g)", inp({ type: "number", min: "0", value: n(t.fat) || "", oninput: function (e) { t.fat = n(e.target.value); refresh(); } }))
    ]),
    line
  ]);
  refresh();
  openDialog({
    title: "Daily targets", body: body, wide: true,
    actions: [{
      label: "Save targets", primary: true,
      onClick: function () {
        S.nutrition.targets = { kcal: n(t.kcal), protein: n(t.protein), carbs: n(t.carbs), fat: n(t.fat) };
        save("nutrition"); render();
      }
    }]
  });
}

function foodLibrary() {
  var wrap = h("div");
  function build() {
    wrap.innerHTML = "";
    var lib = S.nutrition.foods || [];
    if (!lib.length) {
      add(wrap, h("p", { class: "muted", style: "margin-bottom:10px" },
        "Nothing saved yet. Tick \u201cSave to my foods\u201d when you log something you eat often, or add one here."));
    }
    lib.forEach(function (f, i) {
      add(wrap, h("div", { style: "padding:8px 0;border-bottom:1px dotted var(--line)" }, [
        h("div", { class: "mrow" }, [
          inp({ value: f.name, style: "flex:2;min-width:140px", oninput: function (e) { f.name = e.target.value; } }),
          inp({ value: f.serving || "", placeholder: "serving", style: "flex:1;min-width:90px", oninput: function (e) { f.serving = e.target.value; } }),
          h("button", { type: "button", class: "btn sm quiet danger", text: "Remove", onclick: function () { lib.splice(i, 1); build(); } })
        ]),
        h("div", { class: "mrow", style: "margin-top:6px" }, [
          ["kcal", "kcal"], ["protein", "P"], ["carbs", "C"], ["fat", "F"]
        ].map(function (k) {
          return h("label", { class: "mrow", style: "gap:4px;font-size:12px;color:var(--ink-3)" }, [
            k[1],
            inp({ type: "number", step: "0.1", value: hasNum(f[k[0]]) ? f[k[0]] : "", style: "width:78px", oninput: function (e) { f[k[0]] = e.target.value; } })
          ]);
        }))
      ]));
    });
    add(wrap, h("button", {
      type: "button", class: "btn", style: "margin-top:12px", text: "Add a food",
      onclick: function () { (S.nutrition.foods || (S.nutrition.foods = [])).push({ id: uid(), name: "", serving: "", kcal: "", protein: "", carbs: "", fat: "" }); build(); }
    }));
  }
  build();
  openDialog({
    title: "My foods", body: wrap, wide: true,
    actions: [{
      label: "Save", primary: true,
      onClick: function () {
        S.nutrition.foods = (S.nutrition.foods || []).filter(function (f) { return f.name && f.name.trim(); });
        save("nutrition"); render();
      }
    }]
  });
}

/* ---------- Today panel ---------- */
function nutritionPanel() {
  var t = dayTotals(today()), tg = targets(), st = weightStats();
  function line(label, have, want, unit) {
    return h("div", { style: "padding:10px 14px;border-bottom:1px dotted var(--line)" }, [
      h("div", { class: "mrow", style: "justify-content:space-between" }, [
        h("span", { style: "font-size:13px", text: label }),
        h("span", { style: "font-size:13px" }, [
          h("b", { style: "font-weight:600", text: unit === "kcal" ? kc(have) : Math.round(have) + "g" }),
          h("span", { class: "muted", text: want ? " / " + (unit === "kcal" ? kc(want) : Math.round(want) + "g") : "" })
        ])
      ]),
      want ? h("div", { class: "bar" }, h("i", { style: "width:" + (clamp(have / want, 0, 1) * 100).toFixed(1) + "%" })) : null
    ]);
  }
  return h("section", { class: "panel" }, [
    h("header", {}, [
      h("h2", { text: "Food today" }),
      h("div", { class: "rowacts" }, [
        h("button", { class: "btn sm", text: "Log weight", onclick: quickWeighIn }),
        h("button", { class: "btn sm primary", text: "Log food", onclick: function () { editFood(null, today(), defaultMeal()); } })
      ])
    ]),
    h("div", { class: "body flush" }, [
      line("Calories", t.kcal, n(tg.kcal), "kcal"),
      line("Protein", t.protein, n(tg.protein), "g"),
      h("div", { class: "mrow", style: "padding:9px 14px;justify-content:space-between;font-size:12.5px;color:var(--ink-3)" }, [
        h("span", { text: t.count + " item" + (t.count === 1 ? "" : "s") + " logged" }),
        h("span", { text: (function () {
          if (!st) return weightTarget() ? "target set, no weigh-ins yet" : "no weigh-ins yet";
          var txt = "weight, 7-day average " + kgText(st.trend), tp = targetProgress();
          if (tp && tp.toGo !== undefined) {
            txt += tp.maintain ? (Math.abs(tp.toGo) < 0.3 ? " \u00b7 on target" : " \u00b7 " + kgText(Math.abs(tp.toGo)) + " off target")
              : tp.reached ? " \u00b7 target reached"
              : " \u00b7 " + kgText(Math.abs(tp.toGo)) + (tp.toGo > 0 ? " to gain" : " to lose");
          }
          return txt;
        })() })
      ])
    ])
  ]);
}


function quickWeighIn() {
  var existing = (S.body.weights || []).filter(function (w) { return w.date === today(); })[0];
  var st = weightStats();
  var kgIn = inp({ type: "number", step: "0.1", min: "0", value: existing ? existing.kg : "", placeholder: st ? (Math.round(st.trend * 10) / 10).toFixed(1) : "kg" });
  openDialog({
    title: "Weigh-in \u00b7 " + fmtDay(today()),
    body: h("div", {}, [
      field("Weight (kg)", kgIn),
      st ? h("p", { class: "muted", style: "font-size:12.5px", text: "Your 7-day average is " + kgText(st.trend) + "." +
        (weightTarget() ? " Target " + kgText(n(weightTarget().kg)) + "." : "") }) : null
    ]),
    actions: [{
      label: existing ? "Update" : "Save", primary: true,
      onClick: function () {
        if (!n(kgIn.value)) { toast("Enter a weight first."); return false; }
        logWeight(today(), kgIn.value); toast("Weight saved."); render();
      }
    }]
  });
}
/* ============================================================
   Router + boot
   ============================================================ */

var VIEWS = [
  { id: "today", label: "Today", render: viewToday },
  { id: "portfolio", label: "Portfolio", render: viewPortfolio },
  { id: "networth", label: "Net worth", render: viewNetworth },
  { id: "budget", label: "Budget", render: viewBudget },
  { id: "habits", label: "Habits", render: viewHabits },
  { id: "training", label: "Training", render: viewTraining },
  { id: "nutrition", label: "Nutrition", render: viewNutrition },
  { id: "reminders", label: "Reminders", render: viewReminders },
  { id: "settings", label: "Settings", render: viewSettings }
];

function go(id) {
  UI.view = id;
  try { history.replaceState(null, "", "#" + id); } catch (e) {}
  render();
  window.scrollTo(0, 0);
  var v = qs("#view");
  if (v) v.focus({ preventScroll: true });
}

function renderNav() {
  var nav = qs("#nav");
  nav.innerHTML = "";
  var due = dueCount();
  VIEWS.forEach(function (v) {
    var b = h("button", {
      type: "button", "aria-current": UI.view === v.id ? "page" : null,
      onclick: function () { go(v.id); }
    }, [h("span", { text: v.label })]);
    if (v.id === "reminders" && due) b.appendChild(h("span", { class: "badge", text: String(due) }));
    nav.appendChild(b);
  });
}

var rendering = false;
function render() {
  if (rendering) return;
  rendering = true;
  try {
    renderNav();
    var host = qs("#view");
    var y = window.scrollY;
    host.innerHTML = "";
    var v = VIEWS.filter(function (x) { return x.id === UI.view; })[0] || VIEWS[0];
    add(host, v.render());
    window.scrollTo(0, y);
  } catch (err) {
    console.error(err);
    qs("#view").innerHTML = '<div class="empty"><b>Something broke while drawing this view.</b>' +
      '<div>Your data is safe. Reload the page, and if it keeps happening export from Settings.</div></div>';
  }
  rendering = false;
}

function applyTheme() {
  var t = S.settings.theme || "auto";
  if (t === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    var dark = t === "dark" || (t === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    meta.setAttribute("content", dark ? "#161915" : "#F3F4F1");
  }
}

async function boot() {
  var d = new Date();
  qs("#brandDate").textContent = DAYS_S[dowMon(today())] + " " + d.getDate() + " " + MONTHS[d.getMonth()];

  qs("#syncPill").addEventListener("click", function () { if (!Store.forgotten) syncDetails(); });
  qs("#dlg").addEventListener("close", function () { setTimeout(applyPending, 30); });
  document.addEventListener("visibilitychange", function () { if (document.hidden) dirtyNames().forEach(function (nm) { flush(nm); }); });

  qs("#themeBtn").addEventListener("click", function () {
    var order = ["auto", "light", "dark"];
    var i = order.indexOf(S.settings.theme || "auto");
    S.settings.theme = order[(i + 1) % 3];
    applyTheme(); save("settings");
    toast("Theme: " + S.settings.theme);
  });

  var hash = (location.hash || "").replace("#", "");
  if (VIEWS.some(function (v) { return v.id === hash; })) UI.view = hash;

  render();
  await initStore();
  await loadAll();
  applyTheme();

  if (S.settings.lastSnapshot !== today()) catchUpSnapshots({ silent: !S.settings.lastSnapshot });
  setInterval(function () {
    if (S.settings.lastSnapshot !== today()) catchUpSnapshots({ silent: true });
  }, 60000);
  render();

  startAuto();
  catchUp();
  if (Store.remoteConfigured && Store.kind !== "remote" && !Remote.asked) { Remote.asked = true; setTimeout(connectSyncDialog, 400); }
  detectProxy().then(function (found) {
    if (!found) return;
    // Live prices by default here: refresh every 5 minutes unless you've chosen otherwise.
    if (!S.settings.autoChosen && !autoMinutes()) { S.settings.autoRefresh = 5; save("settings"); startAuto(); }
    if (feedCount()) refreshPrices({ silent: true, force: true });
    if (S.settings.fxAt === null || Date.now() - new Date(S.settings.fxAt).getTime() > 20 * 3600000) refreshFx(true);
    render();
  });
  document.addEventListener("visibilitychange", function () { if (!document.hidden) catchUp(); });
  window.addEventListener("focus", catchUp);
  window.addEventListener("online", catchUp);

  // exchange rates move once a day at most
  var fxAge = S.settings.fxAt ? Date.now() - new Date(S.settings.fxAt).getTime() : Infinity;
  if (fxAge > 20 * 3600000 && Object.keys(S.settings.fx).length > 1) refreshFx(true);

  document.addEventListener("keydown", function (e) {
    if (e.target.matches("input,select,textarea") || e.metaKey || e.ctrlKey) return;
    var map = { "1": "today", "2": "portfolio", "3": "networth", "4": "budget",
                "5": "habits", "6": "training", "7": "nutrition", "8": "reminders" };
    if (map[e.key]) go(map[e.key]);
  });
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
